logging:
  level:
    root: info
  file:
    path: /var/log/own/app

spring:
  application:
    name: own-app
  ai:
    openai:
      base-url: "https://api.siliconflow.cn"
      api-key: "${SF_API_KEY}"
      chat:
        completions-path: "/v1/chat/completions"
        options:
          temperature: 0.85
          # model: "Qwen/Qwen3-8B"
          model: "Qwen/Qwen3-32B"
          # model: "Qwen/Qwen3-235B-A22B"

own:
  gateway:
    auth:
      token: "${OWN_GATEWAY_TOKEN}"
  app:
    storage:
      memory:
        max-rows: 10
  vlog:
    hot:
      threshold: 1800
      decay:
        base: 0.5
        half-life-days: 7
        min-factor: 0.3
      new-video:
        days-threshold: 7
        boost: 1.3
      weights:
        viewed-cnt: 2
        like-cnt: 5
        comment-cnt: 3
        author-fans-cnt: 2
        complete-rate: 4
        replay-rate: 3
