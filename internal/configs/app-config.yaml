logging:
  level:
    root: info
  file:
    path: logs



spring:
  application:
    name: own-app
  ai:
    openai:
      base-url: "https://api.siliconflow.cn"
      api-key: "${SF_API_KEY}"
      chat:
        completions-path: "/v1/chat/completions"
        options:
          temperature: 0.85
          # model: "Qwen/Qwen3-8B"
          model: "Qwen/Qwen3-32B"
          # model: "Qwen/Qwen3-235B-A22B"

own:
  app:
    storage:
      memory:
        max-rows: 10
  vlog:
    hot:
      threshold: 500
      decay:
        base: 0.5
        half-life-days: 7
        min-factor: 0.3
      new-video:
        days-threshold: 7
        boost: 1.3
      weights:
        viewed-cnt: 2
        like-cnt: 5
        comment-cnt: 3
        author-fans-cnt: 2
        complete-rate: 4
        replay-rate: 3

--- # Redisson Config
spring:
  redis:
    redisson:
      config: |
        # 指定 DNS 解析工厂类
        # addressResolverGroupFactory: !<org.redisson.connection.DnsAddressResolverGroupFactory> {}
        # 线程池数量
        threads: 4
        # Netty线程池数量
        nettyThreads: 8
        singleServerConfig:
          # 基础连接信息
          address: "redis://192.168.194.87:6379"
          password: "A123456a"
          database: 7
        
          # 连接池配置
          connectionPoolSize: 64
          connectionMinimumIdleSize: 16
          
          # 连接超时
          connectTimeout: 3000
          # 命令等待超时
          timeout: 1000
          # 命令等待超时
          retryAttempts: 3
          # 命令失败重试次数
          retryInterval: 1500
